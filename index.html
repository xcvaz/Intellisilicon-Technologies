<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b12">

    <title>Intellisilicon Technologies | Coming Soon</title>

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --background: #080b12;
            --text: #f4f6fb;
            --muted: #929bad;
            --accent: #62a8ff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .coming-soon {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            text-align: center;
            overflow: hidden;
            position: relative;
            isolation: isolate;
            background:
                radial-gradient(
                    ellipse at 50% 40%,
                    rgba(41, 94, 168, 0.18) 0%,
                    transparent 60%
                ),
                #080b12;
        }

        .coming-soon::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image: radial-gradient(
                rgba(255, 255, 255, 0.12) 0.7px,
                transparent 0.7px
            );
            background-size: 28px 28px;
            opacity: 0.2;
            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 20%,
                black 80%,
                transparent
            );
        }

        .content {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: appear 0.9s ease both;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.5px;
            margin-bottom: 40px;
            color: var(--text);
        }

        .brand strong {
            font-weight: 700;
            color: var(--accent);
        }

        /* 2400x564 Aspect Ratio Image Container */
        .image-wrapper {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 2400 / 564;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
           
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(98, 168, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .image-wrapper:hover {
            border-color: rgba(98, 168, 255, 0.4);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6),
                        0 0 40px rgba(98, 168, 255, 0.2);
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Placeholder state when no image is src'd yet */
        .image-placeholder-text {
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .divider {
            width: 44px;
            height: 2px;
            background: var(--accent);
            opacity: 0.7;
            margin: 40px 0 24px;
            border-radius: 10px;
        }

        footer {
            color: #667083;
            font-size: 12px;
            line-height: 1.8;
            letter-spacing: 0.2px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .brand {
                font-size: 17px;
                margin-bottom: 30px;
            }

            .image-wrapper {
                border-radius: 12px;
            }

            .divider {
                margin: 32px 0 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <main class="coming-soon">
        <div class="content">

            <!-- Brand Header -->
           

            <!-- Image Container (Reserves exact 2400x564 Aspect Ratio) -->
            <div class="image-wrapper">
                <!-- Replace 'your-image-path.jpg' with your image file path when ready -->
                <img src="intellisilicon-logo.png" alt="Intellisilicon Technologies Banner" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="image-placeholder-text" style="display: none;">[ Image Space: 2400 &times; 564 ]</span>
            </div>

            <div class="divider"></div>

            <!-- Footer -->
            <footer>
                &copy; 2026 Intellisilicon Technologies. All rights reserved.
            </footer>

        </div>
    </main>

</body>
</html>
