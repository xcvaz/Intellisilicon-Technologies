
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b12">

    <title>Intellisilicon Technologies | Coming Soon</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    color-scheme: dark;
    --background: #080b12;
    --text: #f4f6fb;
    --muted: #929bad;
    --accent: #62a8ff;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
}

.coming-soon {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 32px 24px;
    text-align: center;
    overflow: hidden;
    position: relative;
    isolation: isolate;
    background:
        radial-gradient(
            ellipse at 50% 40%,
            rgba(41, 94, 168, 0.15) 0%,
            transparent 55%
        ),
        #080b12;
}

.coming-soon::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background-image: radial-gradient(
        rgba(255, 255, 255, 0.12) 0.7px,
        transparent 0.7px
    );
    background-size: 28px 28px;
    opacity: 0.2;
    mask-image: linear-gradient(
        to bottom,
        transparent,
        black 30%,
        black 70%,
        transparent
    );
}

.content {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: appear 0.9s ease both;
}

.brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.5px;
    margin-bottom: 76px;
}

.brand strong {
    font-weight: 700;
}

.brand-icon {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(98, 168, 255, 0.5);
    border-radius: 11px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -1px;
    background: rgba(98, 168, 255, 0.08);
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 15px;
    border: 1px solid rgba(98, 168, 255, 0.22);
    border-radius: 100px;
    color: #a9ceff;
    background: rgba(98, 168, 255, 0.06);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 28px;
}

.status-dot {
    width: 7px;
    height: 7px;
    background: #62a8ff;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(98, 168, 255, 0.8);
    animation: pulse 2s ease-in-out infinite;
}

h1 {
    font-size: clamp(40px, 7vw, 72px);
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -3.5px;
}

h1 span {
    color: var(--accent);
}

.description {
    max-width: 470px;
    margin-top: 25px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.9;
    font-weight: 400;
}

.divider {
    width: 44px;
    height: 2px;
    background: var(--accent);
    opacity: 0.7;
    margin: 54px 0 26px;
    border-radius: 10px;
}

footer {
    color: #667083;
    font-size: 11px;
    line-height: 1.8;
    letter-spacing: 0.2px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(16px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulse {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }
    50% {
        opacity: 0.45;
        transform: scale(0.8);
    }
}

@media (max-width: 600px) {
    .brand {
        margin-bottom: 64px;
        font-size: 15px;
        gap: 10px;
    }

    .brand-icon {
        width: 34px;
        height: 34px;
    }

    h1 {
        letter-spacing: -2px;
    }

    .description {
        font-size: 14px;
        max-width: 340px;
    }

    .divider {
        margin-top: 44px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
    }
}

</style>
<body>

    <main class="coming-soon">
        <div class="content">

            <div class="brand">
                <span>Intellisilicon <strong>Technologies</strong></span>
            </div>

            <h1>
                Something brilliant<br>
                is <span>in the making.</span>
            </h1>

            <p class="description">
                Coming Soon......
            </p>

            <div class="divider"></div>

            <footer>
                &copy; 2026 Intellisilicon Technologies.
                All rights reserved.
            </footer>

        </div>
    </main>

</body>
</html>
